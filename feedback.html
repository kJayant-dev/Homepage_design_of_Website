<!-- feeback.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback Form</title>
    <link rel="shortcut icon" href="faviconlogo.jpg" type="image/x-icon" />
    <link rel="stylesheet" href="feedbackstyle.css" />
    <style>
      * {
        background-color: bisque;
      }
      .form-container {
        max-width: 700px;
        margin-top: 40px;
        margin-bottom: 40px;
      }

      .form-intro {
        text-align: center;
        margin-bottom: 30px;
        font-size: 1.1rem;
        color: #555;
      }

      .feedback-form {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .form-label {
        margin-bottom: 8px;
        color: #2c3e50;
        font-weight: 600;
        font-size: 1.05rem;
      }

      .form-control {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 1rem;
        font-family: "Times New Roman", Times, serif;
        background-color: #f9fbfd;
      }

      .form-control:focus {
        border-color: #3498db;
        background-color: #ffffff;
      }

      .submit-btn {
        width: 100%;
        border: none;
        padding: 15px;
        font-size: 1.2rem;
        margin-top: 10px;
      }

      .back-link {
        text-align: center;
        margin-top: 25px;
      }

      .back-link a {
        color: #3498db;
        font-weight: 600;
      }

      .back-link a:hover {
        color: #2c3e50;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container form-container">
      <!-- Start  -->
      <div id="nav">
        <span class="anch">
          <a href="./main.html" style="text-decoration: none; color: black"
            >Home</a
          >
        </span>
        <span class="anch">
          <a
            href="./feedback.html"
            target="_blank"
            title="Feedback form for Suggestions"
            style="text-decoration: none; color: black"
            >Feedback</a
          >
        </span>
      </div>
      <!-- end-->
      <div class="section-card">
        <div class="section-title">
          <h2>Website Feedback</h2>
        </div>

        <p class="form-intro">Thank you for taking the time to Give Feedback</p>

        <form action="#" class="feedback-form">
          <div class="form-group">
            <label for="name" class="form-label">Your Name</label>
            <input
              type="text"
              id="name"
              name="name"
              class="form-control"
              placeholder="Enter your full name"
              required
            />
          </div>

          <div class="form-group">
            <label for="email" class="form-label"
              >Email Address (Optional)</label
            >
            <input
              type="email"
              id="email"
              name="email"
              class="form-control"
              placeholder="Enter your email"
            />
          </div>

          <div class="form-group">
            <label for="comments" class="form-label"
              >Comments / Suggestions</label
            >
            <textarea
              id="comments"
              name="comments"
              rows="5"
              class="form-control"
              placeholder="What did you like? What can I improve?"
              required
            ></textarea>
          </div>

          <button type="submit" class="btn submit-btn">
            <a
              href="./submit.html"
              style="
                text-decoration: none;
                color: white;
                border: 2px solid blue;
                border-radius: 8px;
                padding: 8px;
                background-color: blue;
              "
              >Submit Feedback</a
            >
          </button>
        </form>

        <div class="back-link">
          <a href="main.html">← Back to Main Website</a>
        </div>
      </div>
    </div>
  </body>
</html>
